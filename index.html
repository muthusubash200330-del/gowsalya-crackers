<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks Store</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff8ef;
  color:#222;
}
header{
  background:linear-gradient(135deg,#b30000,#ff6a00);
  color:white;
  padding:20px 15px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:8px 0 0}

.top{
  position:sticky;
  top:0;
  z-index:10;
  background:white;
  padding:12px;
  box-shadow:0 2px 8px #bbb;
}

.search{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

select{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  padding:15px;
}

.card{
  background:white;
  border-radius:14px;
  padding:12px;
  box-shadow:0 2px 8px #ddd;
}

.icon{
  height:100px;
  background:linear-gradient(135deg,#fff0d5,#ffd27d);
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
}

.card h3{
  font-size:16px;
  margin:10px 0 6px;
}

.category{
  font-size:12px;
  color:#777;
}

.price{
  color:#d00000;
  font-size:20px;
  font-weight:bold;
  margin-top:8px;
}

.mrp{
  color:#999;
  text-decoration:line-through;
  font-size:13px;
}

.discount{
  display:inline-block;
  background:#008a35;
  color:white;
  padding:4px 7px;
  border-radius:5px;
  font-size:11px;
  margin-top:5px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px;
  cursor:pointer;
}

.add{
  width:100%;
  margin-top:10px;
  background:#ff5a00;
  color:white;
  font-weight:bold;
}

.cartButton{
  position:fixed;
  right:15px;
  bottom:18px;
  z-index:20;
  background:#008a35;
  color:white;
  border-radius:50px;
  padding:14px 18px;
  font-size:16px;
  box-shadow:0 4px 12px #777;
}

.cart{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:30;
}

.cartBox{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(430px,100%);
  background:white;
  padding:18px;
  overflow:auto;
}

.cartHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  background:#eee;
  font-size:20px;
}

.cartItem{
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.cartName{
  font-weight:bold;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.controls button{
  background:#eee;
  min-width:35px;
  font-size:18px;
}

.remove{
  background:#d00000 !important;
  color:white;
  font-size:13px !important;
  padding:7px 10px !important;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:18px 0;
}

.order{
  width:100%;
  background:#25d366;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:8px;
}

.upi{
  margin-top:15px;
  padding:15px;
  background:#f4f4f4;
  border-radius:12px;
}

.upi h3{margin-top:0}

.upi input{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  margin:5px 0;
}

.pay{
  width:100%;
  background:#673ab7;
  color:white;
  font-weight:bold;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

footer{
  text-align:center;
  padding:30px 15px;
  background:#222;
  color:white;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h1>🎆 Fireworks Store 🎆</h1>
  <p>Special Discount • Easy Ordering</p>
</header>

<div class="top">
  <input
    class="search"
    id="search"
    placeholder="🔍 Search products..."
  >

  <select id="category">
    <option value="All">All Categories</option>
  </select>
</div>

<div class="products" id="products"></div>

<button class="cartButton" onclick="openCart()">
  🛒 Cart (<span id="cartCount">0</span>)
</button>

<div class="cart" id="cart">
  <div class="cartBox">

    <div class="cartHeader">
      <h2>🛒 Your Cart</h2>
      <button class="close" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      Total: ₹<span id="total">0.00</span>
    </div>

    <button class="order" onclick="whatsappOrder()">
      📱 Order on WhatsApp
    </button>

    <div class="upi">
      <h3>💳 UPI Payment</h3>

      <p>UPI ID:</p>

      <!-- CHANGE THIS UPI ID -->
      <input
        id="upiId"
        value="muthusubash2003@axl"
        readonly
      >

      <button class="pay" onclick="payUPI()">
        💳 Pay with UPI
      </button>

      <p style="font-size:12px;color:#777">
        Replace YOURUPI@upi with your actual UPI ID.
      </p>
    </div>

  </div>
</div>

<footer>
  <p>🎆 Thank you for shopping with us 🎆</p>
</footer>

<script>

/* ==================================================
   PRODUCTS
   Add your existing products inside this array.
   ================================================== */

const products = [

  {
    id:1,
    name:'4" Gold Lakshmi / Bheem (5Pcs)',
    rate:112,
    price:33.60,
    unit:'1 PKT',
    category:'Single Sound Crackers',
    discount:70
  },

  {
    id:2,
    name:'23/4" Kuruvi / Lakshmi (5Pcs)',
    rate:28,

    unit:'1 PKT',
    category:'Single Sound Crackers',
    discount:70
  },

  {
    id:3,
    name:'3 1/2" Lakshmi / Narthaki / Bheem / Parrot (5Pcs)',
    rate:48,
    price:14.40,
    unit:'1 PKT',
    category:'Single Sound Crackers',
    discount:70
  },

  {
    id:4,
    name:'Bijili Crackers',
    rate:50,
    price:15,
    unit:'1 PKT',
    category:'Bijili Crackers',
    discount:70
  },

  {
    id:5,
    name:'Flower Pots',
    rate:100,
    price:30,
    unit:'1 BOX',
    category:'Flower Pots',
    discount:70
  },

  {
    id:6,
    name:'Colour Fountain',
    rate:150,
    price:45,
    unit:'1 BOX',
    category:'Colour Fountains',
    discount:70
  },

  {
    id:7,
    name:'Twinkling Stars',
    rate:80,
    price:24,
    unit:'1 BOX',
    category:'Twinkling Stars',
    discount:70
  },

  {
    id:8,
    name:'Rocket',
    rate:120,
    price:36,
    unit:'1 BOX',
    category:'Rockets & Chakkaras',
    discount:70
  },

  {
    id:9,
    name:'Gift Pack (16-Items)-Kids',
    rate:240,
    price:240,
    unit:'1 BOX',
    category:'Gift Packs',
    discount:0
  },

  {
    id:10,
    name:'Gift Pack (25-Items)',
    rate:350,
    price:350,
    unit:'1 BOX',
    category:'Gift Packs',
    discount:0
  },

  {
    id:11,
    name:'Gift Pack (50-Items)',
    rate:1000,
    price:1000,
    unit:'1 BOX',
    category:'Gift Packs',
    discount:0
  },

  {
    id:12,
    name:'Premium Family Combo',
    rate:3000,
    price:3000,
    unit:'1 COMBO',
    category:'Premium Family Combo Offers',
    discount:0
  },

  {
    id:13,
    name:'Premium Family Combo',
    rate:5000,
    price:5000,
    unit:'1 COMBO',
    category:'Premium Family Combo Offers',
    discount:0
  },

  {
    id:14,
    name:'Fruits Series',
    rate:200,
    price:60,
    unit:'1 BOX',
    category:'New Arrivals',
    discount:70
  }

];


/* ==================================================
   CART
   ================================================== */

let cart = [];


/* ==================================================
   CATEGORY
   ================================================== */

const categoryBox = document.getElementById('category');

const categories = [
  ...new Set(products.map(p => p.category))
];

categories.forEach(c => {

  const option = document.createElement('option');

  option.value = c;
  option.textContent = c;

  categoryBox.appendChild(option);

});


/* ==================================================
   DISPLAY PRODUCTS
   ================================================== */

function displayProducts(){

  const box = document.getElementById('products');

  const search =
    document.getElementById('search').value
    .toLowerCase();

  const selectedCategory =
    categoryBox.value;

  const filtered = products.filter(p => {

    const matchesSearch =
      p.name.toLowerCase().includes(search);

    const matchesCategory =
      selectedCategory === 'All' ||
      p.category === selectedCategory;

    return matchesSearch && matchesCategory;

  });


  box.innerHTML = '';


  if(filtered.length === 0){

    box.innerHTML =
      '<div class="empty">😔 Product not found</div>';

    return;

  }


  filtered.forEach(p => {

    const card =
      document.createElement('div');

    card.className = 'card';

    card.innerHTML = `

      <div class="icon">🎆</div>

      <h3>${p.name}</h3>

      <div class="category">
        ${p.category}
      </div>

      ${
        p.discount > 0
        ? `<span class="discount">${p.discount}% OFF</span>`
        : ''
      }

      <div class="price">
        ₹${Number(p.price).toFixed(2)}
      </div>

      ${
        p.discount > 0
        ? `<div class="mrp">₹${Number(p.rate).toFixed(2)}</div>`
        : ''
      }

      <div style="font-size:12px;color:#777;margin-top:5px">
        ${p.unit}
      </div>

      <button class="add">
        ➕ Add to Cart
      </button>

    `;

    card
      .querySelector('.add')
      .addEventListener('click', () => addToCart(p.id));

    box.appendChild(card);

  });

}


/* ==================================================
   ADD TO CART
   ================================================== */

function addToCart(id){

  const product =
    products.find(p => p.id === id);

  if(!product) return;

  const existing =
    cart.find(item => item.id === id);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }

  updateCart();

  openCart();

}


/* ==================================================
   REMOVE PRODUCT COMPLETELY
   ================================================== */

function removeFromCart(id){

  cart =
    cart.filter(item => item.id !== id);

  updateCart();

}


/* ==================================================
   CHANGE QUANTITY
   ================================================== */

function changeQty(id, amount){

  const item =
    cart.find(item => item.id === id);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){

    removeFromCart(id);
    return;

  }

  updateCart();

}


/* ==================================================
   UPDATE CART
   ================================================== */

function updateCart(){

  const box =
    document.getElementById('cartItems');

  box.innerHTML = '';

  let total = 0;
  let count = 0;


  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">🛒 Cart is empty</div>';

  }


  cart.forEach(item => {

    total += Number(item.price) * item.qty;

    count += item.qty;


    const div =
      document.createElement('div');

    div.className = 'cartItem';

    div.innerHTML = `

      <div class="cartName">
        ${item.name}
      </div>

      <div>
        ₹${Number(item.price).toFixed(2)}
        × ${item.qty}
      </div>

      <div class="controls">

        <button onclick="changeQty(${item.id},-1)">
          −
        </button>

        <strong>${item.qty}</strong>

        <button onclick="changeQty(${item.id},1)">
          +
        </button>

        <button
          class="remove"
          onclick="removeFromCart(${item.id})"
        >
          🗑 Remove
        </button>

      </div>

    `;

    box.appendChild(div);

  });


  document.getElementById('total')
    .textContent = total.toFixed(2);

  document.getElementById('cartCount')
    .textContent = count;

}


/* ==================================================
   OPEN / CLOSE CART
   ================================================== */

function openCart(){

  document.getElementById('cart')
    .style.display = 'block';

}

function closeCart(){

  document.getElementById('cart')
    .style.display = 'none';

}


/* ==================================================
   WHATSAPP ORDER
   ================================================== */

function whatsappOrder(){

  if(cart.length === 0){

    alert('Please add a product first.');

    return;

  }


  let message =
    '🎆 NEW FIREWORKS ORDER 🎆%0A%0A';

  cart.forEach(item => {

    message +=
      `• ${item.name}%0A` +
      `  Qty: ${item.qty}%0A` +
      `  Price: ₹${(item.price * item.qty).toFixed(2)}%0A%0A`;

  });


  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );


  message +=
    `💰 TOTAL: ₹${total.toFixed(2)}%0A`;


  /*
    CHANGE THIS NUMBER
    Example:
    India WhatsApp number:
    919876543210
  */

  const whatsappNumber =
    '916379577670';


  window.open(
    'https://wa.me/' +
    whatsappNumber +
    '?text=' +
    message,
    '_blank'
  );

}


/* ==================================================
   UPI PAYMENT
   ================================================== */

function payUPI(){

  if(cart.length === 0){

    alert('Please add a product first.');

    return;

  }


  const upi =
    document.getElementById('upiId').value;

  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.qty,
      0
    );


  const url =
    'upi://pay' +
    '?pa=' + encodeURIComponent(upi) +
    '&pn=' + encodeURIComponent('Fireworks Store') +
    '&am=' + total.toFixed(2) +
    '&cu=INR';


  window.location.href = url;

}


/* ==================================================
   SEARCH / CATEGORY EVENTS
   ================================================== */

document
  .getElementById('search')
  .addEventListener('input', displayProducts);

categoryBox
  .addEventListener('change', displayProducts);


/* ==================================================
   START WEBSITE
   ================================================== */

displayProducts();
updateCart();

</script>

</body>
</html>
